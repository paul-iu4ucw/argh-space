# Tutto il sito su un solo server. Le variabili stanno nel file .env accanto a questo (vedi env.example).
name: argh

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-database-url: &database-url postgres://argh:${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD in .env}@db:5432/argh

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: argh
      POSTGRES_DB: argh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "argh", "-d", "argh"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  app:
    image: ${IMAGE:-argh}:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
      DB_POOL_MAX: "10"
      MEDIA_DIR: /data/media
    volumes: [media:/data/media]
    # solo in locale al server: dall'esterno si passa da Caddy (o dal tuo reverse proxy)
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  # Migrazioni e seed: parte solo quando lo si chiama (docker compose run --rm tools …)
  tools:
    image: ${IMAGE:-argh}:${TAG:-latest}-tools
    profiles: [tools]
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db: { condition: service_healthy }

  # HTTPS automatico (Let's Encrypt). Si attiva con COMPOSE_PROFILES=https
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:-argh.space, wiki.argh.space}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    logging: *logging

  # Sostituisce i cron di Vercel
  cron:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?manca CRON_SECRET in .env}
    volumes: [./cron:/argh:ro]
    command: ["sh", "-c", "cp /argh/crontab /etc/crontabs/root && exec crond -f -l 8"]
    depends_on: [app]
    logging: *logging

  # Copia giornaliera di database e immagini in ./backups
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./cron:/argh:ro
      - ./backups:/backups
      - media:/media:ro
    command: ["sh", "/argh/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

name: Build e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immagine tools (migrazioni e seed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}-tools
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max

      - name: Compile e build del sito
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://argh.space' }}
            NEXT_PUBLIC_WIKI_URL=${{ vars.NEXT_PUBLIC_WIKI_URL || 'https://wiki.argh.space' }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-NFZ4HSFL' }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max

      - name: Prova di avvio (database vuoto, migrazioni, sito)
        env:
          IMG: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          DB: postgres://postgres:ci@db:5432/argh
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=argh postgres:17-alpine
          timeout 60 sh -c 'until docker exec db pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'
          docker run --rm --network smoke -e DATABASE_URL="$DB" "$IMG-tools"
          docker run -d --name app --network smoke -p 3000:3000 -e DATABASE_URL="$DB" -e AUTH_SECRET=solo-per-la-prova-di-avvio-0123456789 "$IMG"
          trap 'docker logs app' EXIT
          timeout 60 sh -c 'until curl -fsS http://localhost:3000/api/health; do sleep 1; done'
          for p in / /novita /dashboard /wiki /logo.png; do curl -fsS -o /dev/null -w "%{http_code} $p\n" "http://localhost:3000$p"; done

      - name: Pubblica le immagini su GHCR
        env:
          IMG: ${{ steps.meta.outputs.image }}:${{ github.sha }}
        run: |
          docker push "$IMG"
          docker push "$IMG-tools"

  deploy:
    needs: build
    # Il deploy parte solo quando imposti la variabile DEPLOY_ENABLED=true nel repository
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DIR: /opt/argh
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara la chiave SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host server
            HostName $SSH_HOST
            User $SSH_USER
            Port ${SSH_PORT:-22}
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          CFG

      - name: Copia i file di deploy
        run: tar -C deploy -czf - docker-compose.yml proxy.yml caddy deploy.sh import-db.sh env.example cron | ssh server "tar -xzf - -C $DIR"

      - name: Aggiorna il sito
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | ssh server "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          trap 'ssh server "docker logout ghcr.io"' EXIT
          ssh server "$DIR/deploy.sh '$IMAGE' '$GITHUB_SHA'"
